<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#06060e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BARRAGE">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>BARRAGE</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    *, *::before, *::after {
      margin:0; padding:0; box-sizing:border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body { width:100%; height:100%; overflow:hidden; background:#06060e; }
    body {
      display:flex; align-items:center; justify-content:center;
      min-height:100vh; touch-action:none;
      font-family: "Oxanium", "Zen Kaku Gothic New", "Yu Gothic UI", Meiryo, sans-serif;
    }
    #canvas {
      display:block;
      width:  min(100vw, calc(100vh * 390 / 700));
      height: min(100vh, calc(100vw * 700 / 390));
      touch-action:none;
    }
    @supports (height:1dvh){
      body { min-height:100dvh; }
      #canvas {
        width:  min(100vw, calc(100dvh * 390 / 700));
        height: min(100dvh, calc(100vw * 700 / 390));
      }
    }
  </style>
</head>
<body>
<canvas id="canvas" width="390" height="700"></canvas>
<script>
  window.BARRAGE_GOOGLE_CLIENT_ID = "1014896137390-a99h1cgd0bebkh2h88frac5l3gq6llpr.apps.googleusercontent.com";
  window.__BARRAGE_ERROR__ = "";
  window.addEventListener("error", event => {
    window.__BARRAGE_ERROR__ = event.message || String(event.error || "error");
  });
  window.addEventListener("unhandledrejection", event => {
    window.__BARRAGE_ERROR__ = String(event.reason?.message || event.reason || "rejection");
  });
  const canUseServiceWorker =
    "serviceWorker" in navigator &&
    (location.protocol === "https:" ||
      location.hostname === "localhost" ||
      location.hostname === "127.0.0.1" ||
      location.hostname === "::1");
  if (canUseServiceWorker) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(error => {
        window.__BARRAGE_SW_ERROR__ = error.message || String(error);
      });
    });
  }
</script>
<script type="module" src="src/game.js"></script>
</body>
</html>
