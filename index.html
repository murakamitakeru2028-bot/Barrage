<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#06060e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BARRAGE">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>BARRAGE</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap');
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#06060e; }
    body {
      display:flex; align-items:center; justify-content:center;
      min-height:100vh; user-select:none; touch-action:none;
    }
    #canvas {
      display:block;
      width:  min(100vw, calc(100vh * 390 / 700));
      height: min(100vh, calc(100vw * 700 / 390));
    }
    @supports (height:1dvh){
      body { min-height:100dvh; }
      #canvas {
        width:  min(100vw, calc(100dvh * 390 / 700));
        height: min(100dvh, calc(100vw * 700 / 390));
      }
    }
  </style>
</head>
<body>
<canvas id="canvas" width="390" height="700"></canvas>
<script type="module" src="src/game.js"></script>
</body>
</html>
